# Firmware settings (Kconfig) for both halves. Lines starting with # are off.
# Full list: https://zmk.dev/docs/config

# Deep sleep after 15 minutes without typing (saves the small 110 mAh battery).
# A key press wakes the board up again.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Show the battery level of the right half on the computer too (not only the left).
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Stronger Bluetooth signal, at the cost of some battery life.
# CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
